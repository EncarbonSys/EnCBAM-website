<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | EnCBAM™</title>
  <link rel="canonical" href="https://encbam.com/">
  <link rel="icon" href="/assets/images/favicon.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #050505; color: #efefef;
      font-family: 'Inter', sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 40px 20px;
    }
    .wrap { max-width: 540px; }
    .code {
      font-family: 'Outfit', sans-serif; font-size: 7rem; font-weight: 800;
      letter-spacing: -.06em; line-height: 1;
      background: linear-gradient(135deg, #10b981, #3b82f6);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; margin-bottom: 24px;
    }
    h1 { font-family: 'Outfit', sans-serif; font-size: 2rem; font-weight: 700; margin-bottom: 16px; }
    p { color: #8a8f98; font-size: 1rem; line-height: 1.7; margin-bottom: 40px; }
    .btn {
      display: inline-flex; align-items: center; gap: 10px;
      background: linear-gradient(135deg, #059669, #10b981);
      color: #fff; font-weight: 600; font-size: .92rem;
      padding: 14px 32px; border-radius: 10px; text-decoration: none;
      transition: transform .3s, box-shadow .3s;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 16px 40px rgba(16,185,129,.3); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <h1>Page Not Found</h1>
    <p>The page you're looking for doesn't exist on EnCBAM™. It may have moved — check our homepage for all CBAM compliance resources.</p>
    <a href="/" class="btn">Back to EnCBAM™ →</a>
  </div>
</body>
</html>
